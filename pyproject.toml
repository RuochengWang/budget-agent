[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "budget-agent"
version = "0.1.0"
description = "赛博节俭局：五人协作开发骨架（演示替身与正式实现分离）"
requires-python = ">=3.11,<3.14"
dependencies = ["pydantic>=2.10,<3", "httpx>=0.28,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
ui = ["streamlit>=1.41,<2"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
budget-agent = "budget_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
budget_agent = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
