name: checks
on: [push, pull_request]
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen --extra dev --extra ui
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run budget-agent run --case sneakers_wait
      - run: uv run budget-agent run --case tissue_buy
